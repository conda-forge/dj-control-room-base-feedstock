# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.5.0"

package:
  name: dj-control-room-base
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dj-control-room-base/dj_control_room_base-${{ version }}.tar.gz
  sha256: 299bfb1e887c4d9cc024c478f05166185fad7520a0c1a5995b51501871598337

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - django >=4.2

tests:
  - python:
      imports:
        - dj_control_room_base
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Core framework for Django Control Room panels
  license: MIT
  license_file: LICENSE
  homepage: https://django-control-room.github.io/dj-control-room-base/
  repository: https://github.com/django-control-room/dj-control-room-base/
  documentation: https://django-control-room.github.io/dj-control-room-base/

extra:
  recipe-maintainers:
    - rxm7706
